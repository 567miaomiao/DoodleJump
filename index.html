<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A playful Doodle Jump game built with JavaScript and p5.js." />
    <title>Skybound Doodle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="brand">
        <span class="brand__spark" aria-hidden="true">✦</span>
        <h1>Skybound Doodle</h1>
        <p>Hop higher. Stay curious.</p>
      </header>

      <section id="game-container" class="canvas-frame" aria-label="Skybound Doodle game canvas"></section>

      <p class="controls-hint">
        <span><kbd>←</kbd><kbd>→</kbd> or <kbd>A</kbd><kbd>D</kbd> to move</span>
        <span>Press <kbd>Space</kbd> to start</span>
      </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>
  </body>
</html>
